<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #7ec8f2;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: sans-serif;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    max-width: 880px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑自行车的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8f2"/>
      <stop offset="100%" stop-color="#c6ecff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fbf4d"/>
      <stop offset="100%" stop-color="#4a9436"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4a3"/>
      <stop offset="100%" stop-color="#ffd23f"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="430" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(700,100)">
    <circle r="52" fill="url(#sun)"/>
    <g stroke="#ffd23f" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-66" x2="0" y2="-82"/>
      <line x1="0" y1="66" x2="0" y2="82"/>
      <line x1="-66" y1="0" x2="-82" y2="0"/>
      <line x1="66" y1="0" x2="82" y2="0"/>
      <line x1="-48" y1="-48" x2="-60" y2="-60"/>
      <line x1="48" y1="-48" x2="60" y2="-60"/>
      <line x1="-48" y1="48" x2="-60" y2="60"/>
      <line x1="48" y1="48" x2="60" y2="60"/>
    </g>
  </g>

  <!-- 云朵（SMIL 左移） -->
  <g fill="#ffffff" opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0; -1200 0" dur="18s" repeatCount="indefinite"/>
    <ellipse cx="220" cy="90" rx="55" ry="26"/>
    <ellipse cx="182" cy="98" rx="34" ry="20"/>
    <ellipse cx="260" cy="98" rx="38" ry="22"/>
    <ellipse cx="240" cy="110" rx="48" ry="18"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0; -1200 0" dur="26s" repeatCount="indefinite"/>
    <ellipse cx="520" cy="150" rx="62" ry="28"/>
    <ellipse cx="478" cy="158" rx="38" ry="22"/>
    <ellipse cx="566" cy="158" rx="42" ry="24"/>
    <ellipse cx="544" cy="172" rx="52" ry="20"/>
  </g>

  <!-- 远处小山 -->
  <path d="M0 430 L120 340 L260 430 Z" fill="#a9d18e" opacity="0.5"/>
  <path d="M520 430 L660 320 L800 430 Z" fill="#a9d18e" opacity="0.5"/>

  <!-- 地面 -->
  <rect x="0" y="430" width="800" height="70" fill="url(#grass)"/>
  <path d="M0 430 Q 60 418 120 430 T 260 430 T 400 430 T 540 430 T 680 430 T 800 430 L800 445 L0 445 Z" fill="#5aa73f"/>

  <!-- 地面速度线 -->
  <g stroke="#3e8030" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line y1="458" y2="458">
      <animate attributeName="x1" values="120;0" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="180;60" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line y1="472" y2="472">
      <animate attributeName="x1" values="300;180" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="350;230" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line y1="460" y2="460">
      <animate attributeName="x1" values="480;360" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="540;420" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line y1="474" y2="474">
      <animate attributeName="x1" values="650;530" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="690;570" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===================== 自行车 ===================== -->
  <g>
    <!-- 后轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 200 340" to="360 200 340" dur="1s" repeatCount="indefinite"/>
      <circle cx="200" cy="340" r="72" fill="none" stroke="#2c3e50" stroke-width="9"/>
      <circle cx="200" cy="340" r="58" fill="none" stroke="#d0d7de" stroke-width="2"/>
      <g stroke="#7f8c8d" stroke-width="2.5">
        <line x1="200" y1="268" x2="200" y2="412"/>
        <line x1="128" y1="340" x2="272" y2="340"/>
        <line x1="149" y1="289" x2="251" y2="391"/>
        <line x1="251" y1="289" x2="149" y2="391"/>
        <line x1="164" y1="268" x2="236" y2="412"/>
        <line x1="236" y1="268" x2="164" y2="412"/>
        <line x1="128" y1="310" x2="272" y2="370"/>
        <line x1="128" y1="370" x2="272" y2="310"/>
      </g>
      <circle cx="200" cy="340" r="9" fill="#2c3e50"/>
    </g>

    <!-- 前轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 590 340" to="360 590 340" dur="1s" repeatCount="indefinite"/>
      <circle cx="590" cy="340" r="72" fill="none" stroke="#2c3e50" stroke-width="9"/>
      <circle cx="590" cy="340" r="58" fill="none" stroke="#d0d7de" stroke-width="2"/>
      <g stroke="#7f8c8d" stroke-width="2.5">
        <line x1="590" y1="268" x2="590" y2="412"/>
        <line x1="518" y1="340" x2="662" y2="340"/>
        <line x1="539" y1="289" x2="641" y2="391"/>
        <line x1="641" y1="289" x2="539" y2="391"/>
        <line x1="554" y1="268" x2="626" y2="412"/>
        <line x1="626" y1="268" x2="554" y2="412"/>
        <line x1="518" y1="310" x2="662" y2="370"/>
        <line x1="518" y1="370" x2="662" y2="310"/>
      </g>
      <circle cx="590" cy="340" r="9" fill="#2c3e50"/>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#e74c3c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="200" y1="340" x2="370" y2="340"/>
      <line x1="200" y1="340" x2="285" y2="205"/>
      <line x1="370" y1="340" x2="285" y2="205"/>
      <line x1="370" y1="340" x2="540" y2="185"/>
      <line x1="285" y1="205" x2="540" y2="185"/>
      <line x1="540" y1="185" x2="590" y2="340"/>
    </g>

    <!-- 车座 -->
    <g>
      <line x1="285" y1="205" x2="278" y2="190" stroke="#2c3e50" stroke-width="5"/>
      <path d="M255 188 Q 278 178 302 188 L 302 194 Q 278 184 255 194 Z" fill="#1f2937"/>
    </g>

    <!-- 车把 -->
    <g stroke="#2c3e50" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="540" y1="185" x2="548" y2="162"/>
      <line x1="520" y1="160" x2="576" y2="160"/>
    </g>

    <!-- 牙盘 + 曲柄 + 踏板 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 370 340" to="360 370 340" dur="1s" repeatCount="indefinite"/>
      <circle cx="370" cy="340" r="28" fill="#34495e"/>
      <circle cx="370" cy="340" r="22" fill="#e74c3c"/>
      <circle cx="370" cy="340" r="6" fill="#2c3e50"/>
      <g stroke="#34495e" stroke-width="3">
        <line x1="370" y1="312" x2="370" y2="305"/>
        <line x1="370" y1="368" x2="370" y2="375"/>
        <line x1="342" y1="340" x2="335" y2="340"/>
        <line x1="398" y1="340" x2="405" y2="340"/>
      </g>
      <line x1="370" y1="340" x2="370" y2="288" stroke="#2c3e50" stroke-width="7" stroke-linecap="round"/>
      <rect x="348" y="282" width="44" height="12" rx="4" fill="#1f2937"/>
      <line x1="370" y1="340" x2="370" y2="392" stroke="#2c3e50" stroke-width="7" stroke-linecap="round"/>
      <rect x="348" y="386" width="44" height="12" rx="4" fill="#1f2937"/>
    </g>

    <!-- 传动链 -->
    <g stroke="#7f8c8d" stroke-width="3.5" fill="none">
      <line x1="200" y1="316" x2="370" y2="316"/>
      <line x1="200" y1="364" x2="370" y2="364"/>
    </g>
    <circle cx="200" cy="340" r="14" fill="#95a5a6"/>
    <circle cx="200" cy="340" r="6" fill="#2c3e50"/>
  </g>

  <!-- ===================== 鹈鹕 ===================== -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="0.5s" repeatCount="indefinite"/>

      <!-- 尾巴 -->
      <g fill="#eaeef2" stroke="#b6c2cc" stroke-width="2">
        <path d="M205 118 L160 88 L185 112 Z"/>
        <path d="M208 130 L155 108 L182 128 Z"/>
        <path d="M210 142 L162 132 L182 142 Z"/>
      </g>

      <!-- 腿 -->
      <g stroke="#e8a33d" stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M275 168 Q 320 250 370 382"/>
        <path d="M300 168 Q 356 220 372 296"/>
      </g>
      <!-- 脚掌 -->
      <g fill="#e8a33d">
        <ellipse cx="370" cy="384" rx="16" ry="7">
          <animateTransform attributeName="transform" type="rotate" from="0 370 340" to="360 370 340" dur="1s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="372" cy="296" rx="16" ry="7">
          <animateTransform attributeName="transform" type="rotate" from="0 370 340" to="360 370 340" dur="1s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- 身体 -->
      <ellipse cx="285" cy="115" rx="75" ry="58" fill="#f7fafc" stroke="#c9d6df" stroke-width="2.5" transform="rotate(-10 285 115)"/>

      <!-- 翅膀 -->
      <g>
        <path d="M240 95 C 205 70, 178 60, 165 72 C 175 90, 200 98, 232 108 C 238 112, 244 106, 240 95 Z" fill="#dde7ee" stroke="#aebcc7" stroke-width="2"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-6 250 95; 14 250 95; -6 250 95" dur="0.6s" repeatCount="indefinite"/>
          <path d="M250 92 C 230 55, 200 38, 176 34 C 176 46, 184 58, 196 66 C 178 74, 172 88, 176 102 C 196 96, 224 92, 250 92 Z" fill="#ffffff" stroke="#aebcc7" stroke-width="2"/>
        </g>
      </g>

      <!-- 脖子 -->
      <path d="M320 80 C 352 64, 360 52, 362 44 C 330 48, 306 70, 300 90 Z" fill="#f7fafc" stroke="#c9d6df" stroke-width="2"/>
      <path d="M322 82 C 350 66, 360 56, 364 48 C 336 52, 312 72, 304 92 Z" fill="#f7fafc"/>

      <!-- 头 -->
      <circle cx="376" cy="42" r="27" fill="#f7fafc" stroke="#c9d6df" stroke-width="2.5"/>

      <!-- 头顶小羽毛 -->
      <path d="M360 18 Q 366 6 378 16" fill="none" stroke="#d5a64a" stroke-width="3" stroke-linecap="round"/>

      <!-- 眼睛 -->
      <circle cx="388" cy="36" r="5.5" fill="#1f2937"/>
      <circle cx="390" cy="34" r="2" fill="#ffffff"/>

      <!-- 大喙 -->
      <g>
        <path d="M398 28 C 442 24, 486 36, 508 50 C 510 56, 498 58, 484 56 C 458 54, 428 50, 402 46 Z" fill="#f7a51b" stroke="#d9880a" stroke-width="1.5"/>
        <path d="M402 46 C 428 50, 458 54, 484 56 C 490 62, 476 78, 456 88 C 424 106, 390 122, 380 112 C 368 100, 372 60, 402 46 Z" fill="#f7c14b" stroke="#d9880a" stroke-width="1.5"/>
        <path d="M398 60 C 406 92, 426 108, 448 104 C 456 98, 460 88, 457 78 C 440 88, 414 86, 404 70 Z" fill="#f39c6a"/>
        <circle cx="496" cy="52" r="3" fill="#e08a00"/>
      </g>
    </g>
  </g>

  <!-- 点缀 -->
  <g>
    <ellipse cx="140" cy="452" rx="16" ry="6" fill="#9bcc7d"/>
    <ellipse cx="700" cy="470" rx="20" ry="7" fill="#9bcc7d"/>
    <path d="M470 428 q 6 -12 12 0" stroke="#4a9436" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M500 428 q 8 -16 16 0" stroke="#5aa73f" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
