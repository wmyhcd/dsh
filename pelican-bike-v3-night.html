<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · 夜行</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #141a33 0%, #070a16 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .stage {
    width: min(96vw, 1100px); border-radius: 22px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 18px 60px -12px rgba(0,0,0,.8);
    background: #0b1026;
  }
  svg { display: block; width: 100%; height: auto; }

  /* ---------- 车轮 / 曲柄 ---------- */
  @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .wheel-back  { transform-box: view-box; transform-origin: 288px 362px; animation: spin360 .82s linear infinite; }
  .wheel-front { transform-box: view-box; transform-origin: 556px 362px; animation: spin360 .82s linear infinite; }
  .crank       { transform-box: view-box; transform-origin: 410px 388px; animation: spin360 1.64s linear infinite; }

  /* ---------- 踩踏 ---------- */
  @keyframes pedal {
    0%, 100% { transform: rotate(-12deg); }
    50%      { transform: rotate(12deg); }
  }
  .leg-a { transform-box: view-box; transform-origin: 378px 300px; animation: pedal 1.64s ease-in-out infinite; }
  .leg-b { transform-box: view-box; transform-origin: 378px 300px; animation: pedal 1.64s ease-in-out infinite; animation-delay: -.82s; }

  /* ---------- 身体 ---------- */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3.5px); }
  }
  @keyframes headBob {
    0%, 100% { transform: rotate(-1.2deg) translateY(0); }
    50%      { transform: rotate(1.6deg) translateY(-2px); }
  }
  @keyframes flap {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(6deg); }
  }
  @keyframes pouchJiggle {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(1.5px) scaleY(1.05); }
  }
  .pelican-bob { transform-box: view-box; transform-origin: 368px 300px; animation: bob 1.64s ease-in-out infinite; }
  .head-grp    { transform-box: view-box; transform-origin: 432px 200px; animation: headBob 1.64s ease-in-out infinite; }
  .wing        { transform-box: view-box; transform-origin: 392px 236px; animation: flap .82s ease-in-out infinite; }
  .pouch       { transform-box: view-box; transform-origin: 520px 186px; animation: pouchJiggle .82s ease-in-out infinite; }

  /* ---------- 风景滚动 ---------- */
  @keyframes scroll-far  { from { transform: translateX(0); } to { transform: translateX(-400px); } }
  @keyframes scroll-near { from { transform: translateX(0); } to { transform: translateX(-800px); } }
  @keyframes drift       { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  @keyframes dash-move   { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -120; } }
  .hills-far  { transform-box: view-box; animation: scroll-far  26s linear infinite; }
  .trees      { transform-box: view-box; animation: scroll-near 13s linear infinite; }
  .clouds     { transform-box: view-box; animation: drift       44s linear infinite; }
  .road-dash  { animation: dash-move .95s linear infinite; }

  /* ---------- 星星 / 萤火虫 / 车灯 ---------- */
  @keyframes twinkle {
    0%, 100% { opacity: .18; }
    50%      { opacity: 1; }
  }
  .stars circle { animation: twinkle 3.4s ease-in-out infinite; }
  .stars circle:nth-child(3n)   { animation-delay: -1.1s; }
  .stars circle:nth-child(3n+1) { animation-delay: -2.3s; }
  .stars circle:nth-child(4n)   { animation-delay: -.6s; }

  @keyframes ff {
    0%, 100% { transform: translate(0, 0); opacity: .15; }
    50%      { transform: translate(16px, -20px); opacity: 1; }
  }
  .firefly { transform-box: view-box; animation: ff 4.2s ease-in-out infinite; }
  .firefly:nth-of-type(2) { animation-delay: -1.2s; animation-duration: 5.1s; }
  .firefly:nth-of-type(3) { animation-delay: -2.6s; animation-duration: 3.6s; }
  .firefly:nth-of-type(4) { animation-delay: -.8s;  animation-duration: 4.8s; }
  .firefly:nth-of-type(5) { animation-delay: -3.1s; animation-duration: 5.6s; }
  .firefly:nth-of-type(6) { animation-delay: -1.9s; animation-duration: 3.9s; }

  @keyframes beamFlicker {
    0%, 100% { opacity: .55; }
    42%      { opacity: .68; }
    47%      { opacity: .46; }
    60%      { opacity: .62; }
  }
  .beam { animation: beamFlicker 2.6s ease-in-out infinite; }

  /* ---------- 速度线 ---------- */
  @keyframes whoosh {
    0%   { opacity: 0; transform: translateX(30px); }
    30%  { opacity: .55; }
    100% { opacity: 0; transform: translateX(-90px); }
  }
  .whoosh { animation: whoosh .75s linear infinite; }
  .whoosh:nth-of-type(2) { animation-delay: .19s; }
  .whoosh:nth-of-type(3) { animation-delay: .38s; }
  .whoosh:nth-of-type(4) { animation-delay: .57s; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 500" role="img" aria-label="夜里，一只鹈鹕开着车前灯骑自行车，天上有星星和月亮">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">

      <stop offset="42%"  stop-color="#141c38"/>
      <stop offset="76%"  stop-color="#22304f"/>
      <stop offset="100%" stop-color="#33456b"/>
    </linearGradient>
    <radialGradient id="moonG" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fffbe8"/>
      <stop offset="55%"  stop-color="#f3ecd2"/>
      <stop offset="100%" stop-color="#e6dcbc"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff8d8" stop-opacity=".38"/>
      <stop offset="60%"  stop-color="#cfe0ff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#cfe0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0">

      <stop offset="55%"  stop-color="#ffe9a0" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffe9a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#e9eef8"/>
      <stop offset="100%" stop-color="#c3cdde"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffcf8a"/>
      <stop offset="100%" stop-color="#e79a45"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f0a05a"/>
      <stop offset="100%" stop-color="#cf6f30"/>
    </linearGradient>
    <radialGradient id="fireflyG" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d9ff8a"/>
      <stop offset="45%"  stop-color="#a8e63f" stop-opacity=".55"/>

  <!-- 夜空 -->

  <!-- 星星 -->

    <circle cx="88"  cy="96"  r="1.1"/>
    <circle cx="134" cy="30"  r="1.9"/>
    <circle cx="186" cy="112" r="1.2"/>
    <circle cx="228" cy="52"  r="1.5"/>
    <circle cx="272" cy="140" r="1.0"/>
    <circle cx="318" cy="34"  r="1.7"/>
    <circle cx="356" cy="96"  r="1.2"/>
    <circle cx="404" cy="146" r="1.4"/>
    <circle cx="446" cy="46"  r="1.8"/>
    <circle cx="492" cy="108" r="1.1"/>
    <circle cx="536" cy="26"  r="1.5"/>
    <circle cx="578" cy="88"  r="1.2"/>
    <circle cx="622" cy="148" r="1.6"/>
    <circle cx="664" cy="44"  r="1.1"/>
    <circle cx="712" cy="104" r="1.8"/>
    <circle cx="756" cy="34"  r="1.3"/>
    <circle cx="790" cy="120" r="1.5"/>
    <circle cx="66"  cy="172" r="1.0"/>
    <circle cx="164" cy="196" r="1.3"/>
    <circle cx="246" cy="188" r="1.1"/>
    <circle cx="332" cy="212" r="1.4"/>
    <circle cx="418" cy="186" r="1.0"/>
    <circle cx="506" cy="206" r="1.3"/>
    <circle cx="592" cy="192" r="1.1"/>
    <circle cx="690" cy="176" r="1.4"/>
    <circle cx="770" cy="204" r="1.0"/>
  </g>

  <!-- 月亮 -->
  <circle cx="654" cy="98" r="112" fill="url(#moonHalo)"/>
  <circle cx="654" cy="98" r="44"  fill="url(#moonG)"/>
  <g fill="#e2d8b4" opacity=".55">
    <circle cx="640" cy="86"  r="7"/>
    <circle cx="668" cy="112" r="5"/>
    <circle cx="662" cy="82"  r="3.5"/>
    <circle cx="634" cy="112" r="4"/>
  </g>

  <!-- 薄云 -->
  <g class="clouds" opacity=".28">
    <g fill="#3a4a72">

      <ellipse cx="196" cy="124" rx="34" ry="13"/>
    </g>
    <g fill="#3a4a72">
      <ellipse cx="560" cy="170" rx="46" ry="10"/>
      <ellipse cx="596" cy="165" rx="28" ry="11"/>
    </g>
    <g fill="#3a4a72">
      <ellipse cx="960" cy="140" rx="58" ry="12"/>
      <ellipse cx="1006" cy="134" rx="34" ry="13"/>
    </g>
  </g>

  <!-- 远山 -->
  <g class="hills-far" opacity=".85">
    <path d="M0 400 Q 80 318 160 400 T 320 400 T 480 400 T 640 400 T 800 400 T 960 400 T 1120 400 L1120 424 L0 424 Z" fill="#1a2440"/>
    <path d="M400 400 Q 470 340 540 400 T 680 400 T 820 400 T 960 400 T 1100 400 T 1240 400 L1240 424 L400 424 Z" fill="#212d4d"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="404" width="800" height="96" fill="#151d33"/>

  <!-- 树影 -->
  <g class="trees">
    <g fill="#101728">
      <path d="M60 412 l 14 -58 l 14 58 z"/>
      <path d="M120 412 l 10 -40 l 10 40 z"/>
      <path d="M300 412 l 16 -66 l 16 66 z"/>
      <path d="M352 412 l 11 -44 l 11 44 z"/>
      <path d="M560 412 l 15 -60 l 15 60 z"/>
      <path d="M614 412 l 10 -38 l 10 38 z"/>
      <path d="M740 412 l 13 -52 l 13 52 z"/>
    </g>
    <g fill="#101728" transform="translate(800 0)">
      <path d="M60 412 l 14 -58 l 14 58 z"/>
      <path d="M120 412 l 10 -40 l 10 40 z"/>
      <path d="M300 412 l 16 -66 l 16 66 z"/>
      <path d="M352 412 l 11 -44 l 11 44 z"/>
      <path d="M560 412 l 15 -60 l 15 60 z"/>
      <path d="M614 412 l 10 -38 l 10 38 z"/>
      <path d="M740 412 l 13 -52 l 13 52 z"/>
    </g>
  </g>

  <!-- 路面 -->
  <rect x="0" y="440" width="800" height="60" fill="#0d1324"/>
  <rect x="0" y="440" width="800" height="3" fill="#2a3554"/>
  <line class="road-dash" x1="-40" y1="472" x2="860" y2="472" stroke="#f0d9a8" stroke-width="5"
        stroke-dasharray="46 34" stroke-linecap="round" opacity=".55"/>

  <!-- 速度线 -->
  <g stroke="#cfe0ff" stroke-width="2.5" stroke-linecap="round" opacity=".4">
    <line class="whoosh" x1="226" y1="250" x2="286" y2="250"/>
    <line class="whoosh" x1="210" y1="288" x2="282" y2="288"/>
    <line class="whoosh" x1="232" y1="326" x2="292" y2="326"/>
    <line class="whoosh" x1="218" y1="364" x2="276" y2="364"/>
  </g>

  <!-- 车前灯的光锥 -->
  <g class="beam">
    <path d="M586 240 L 790 208 L 800 306 L 586 252 Z" fill="url(#beamG)"/>
  </g>

  <!-- ============ 自行车 ============ -->
  <g id="bike">
    <g>
      <circle cx="288" cy="362" r="58" fill="none" stroke="#0a0f1c" stroke-width="8"/>
      <g class="wheel-back">
        <circle cx="288" cy="362" r="48" fill="none" stroke="#5d6a85" stroke-width="2.5"/>
        <g stroke="#44506a" stroke-width="2.5" stroke-linecap="round">
          <line x1="288" y1="316" x2="288" y2="408"/><line x1="242" y1="362" x2="334" y2="362"/>
          <line x1="255" y1="329" x2="321" y2="395"/><line x1="321" y1="329" x2="255" y2="395"/>
          <line x1="266" y1="320" x2="310" y2="404"/><line x1="310" y1="320" x2="266" y2="404"/>
          <line x1="246" y1="344" x2="330" y2="380"/><line x1="246" y1="380" x2="330" y2="344"/>
        </g>
        <circle cx="288" cy="362" r="6" fill="#39445c"/>
      </g>
    </g>

    <g>
      <circle cx="556" cy="362" r="58" fill="none" stroke="#0a0f1c" stroke-width="8"/>
      <g class="wheel-front">
        <circle cx="556" cy="362" r="48" fill="none" stroke="#5d6a85" stroke-width="2.5"/>
        <g stroke="#44506a" stroke-width="2.5" stroke-linecap="round">
          <line x1="556" y1="316" x2="556" y2="408"/><line x1="510" y1="362" x2="602" y2="362"/>
          <line x1="523" y1="329" x2="589" y2="395"/><line x1="589" y1="329" x2="523" y2="395"/>
          <line x1="534" y1="320" x2="578" y2="404"/><line x1="578" y1="320" x2="534" y2="404"/>
          <line x1="514" y1="344" x2="598" y2="380"/><line x1="514" y1="380" x2="598" y2="344"/>
        </g>
        <circle cx="556" cy="362" r="6" fill="#39445c"/>
      </g>
    </g>

    <g stroke="#33d6c4" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="288" y1="362" x2="410" y2="388"/>
      <line x1="288" y1="362" x2="352" y2="284"/>
      <line x1="410" y1="388" x2="352" y2="284"/>
      <line x1="352" y1="284" x2="536" y2="278"/>
      <line x1="410" y1="388" x2="546" y2="312"/>
      <line x1="536" y1="278" x2="546" y2="312"/>
      <line x1="546" y1="312" x2="556" y2="362"/>
    </g>
    <g stroke="#8ff5e8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".55">
      <line x1="356" y1="280" x2="532" y2="274"/>
      <line x1="414" y1="384" x2="542" y2="309"/>
    </g>

    <path d="M536 278 L544 254 Q548 244 560 244 L586 244" fill="none" stroke="#1f9c92" stroke-width="8" stroke-linecap="round"/>

    <!-- 车前灯 -->
    <circle cx="588" cy="244" r="9" fill="#fff3c0"/>
    <circle cx="588" cy="244" r="14" fill="#fff3c0" opacity=".28"/>

    <path d="M330 276 q 22 -10 46 0 q -22 12 -46 0 z" fill="#1b2338"/>
    <line x1="352" y1="284" x2="352" y2="292" stroke="#1b2338" stroke-width="5"/>

    <g class="crank">
      <circle cx="410" cy="388" r="26" fill="none" stroke="#4a5570" stroke-width="4"/>
      <circle cx="410" cy="388" r="20" fill="none" stroke="#5d6a85" stroke-width="3"/>
      <g stroke="#39445c" stroke-width="5" stroke-linecap="round">
        <line x1="410" y1="388" x2="410" y2="356"/><line x1="410" y1="388" x2="410" y2="420"/>
      </g>
      <rect x="396" y="348" width="28" height="9" rx="4" fill="#1b2338"/>
      <rect x="396" y="416" width="28" height="9" rx="4" fill="#1b2338"/>
      <circle cx="410" cy="388" r="5" fill="#2a3554"/>

  </g>

  <!-- ============ 鹈鹕 ============ -->
  <g class="pelican-bob">
    <g class="leg-b" stroke="#e89a52" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="378" y1="300" x2="394" y2="340"/>
      <line x1="394" y1="340" x2="404" y2="372"/>

    </g>

    <path d="M312 236 q -34 -6 -46 12 q 22 8 44 2 z" fill="#a9b5c9"/>

    <ellipse cx="368" cy="250" rx="64" ry="50" fill="url(#bodyG)"/>
    <path d="M312 268 q 56 40 118 4 q -8 34 -58 34 q -48 0 -60 -38 z" fill="#c9d2e2" opacity=".75"/>

    <path d="M404 222 C 418 186, 424 170, 438 162 L 462 178 C 448 192, 442 208, 432 232 Z" fill="url(#bodyG)"/>

      <path class="pouch" d="M482 178 Q 500 232 566 208 Q 606 194 618 178 Q 552 196 482 178 Z"

      <circle cx="464" cy="156" r="2.2" fill="#ffffff"/>
      <path d="M452 148 q 10 -5 19 -1" stroke="#aab5c8" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <g class="wing">
      <path d="M386 232 q 44 -14 62 12 q -20 26 -52 22 q -18 -2 -10 -34 z" fill="#dde5f2" stroke="#a9b5c9" stroke-width="2"/>

    <g class="leg-a" stroke="#e89a52" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="378" y1="300" x2="396" y2="338"/>
      <line x1="396" y1="338" x2="412" y2="370"/>
      <path d="M412 370 l 16 6 l -5 8 l -14 -4 z" fill="#e89a52" stroke="none"/>
    </g>
  </g>

  <!-- 萤火虫 -->
  <g>
    <g class="firefly">
      <circle cx="150" cy="330" r="14" fill="url(#fireflyG)"/>
      <circle cx="150" cy="330" r="2.5" fill="#eaffb0"/>
    </g>
    <g class="firefly">
      <circle cx="236" cy="270" r="11" fill="url(#fireflyG)"/>
      <circle cx="236" cy="270" r="2" fill="#eaffb0"/>
    </g>
    <g class="firefly">
      <circle cx="96"  cy="392" r="12" fill="url(#fireflyG)"/>
      <circle cx="96"  cy="392" r="2.2" fill="#eaffb0"/>
    </g>
    <g class="firefly">
      <circle cx="318" cy="360" r="10" fill="url(#fireflyG)"/>
      <circle cx="318" cy="360" r="2" fill="#eaffb0"/>

    <g class="firefly">

  </g>
</svg>
</div>
</body>
</html>
