<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · 日落</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #2b3352 0%, #1c2036 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .stage {
    width: min(96vw, 1100px); border-radius: 22px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 50px -12px rgba(0,0,0,.6);
    background: #5b3a5e;
  }
  svg { display: block; width: 100%; height: auto; }

  @keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .wheel-back  { transform-box: view-box; transform-origin: 288px 362px; animation: spin360 .78s linear infinite; }
  .wheel-front { transform-box: view-box; transform-origin: 556px 362px; animation: spin360 .78s linear infinite; }
  .crank       { transform-box: view-box; transform-origin: 410px 388px; animation: spin360 1.56s linear infinite; }

  @keyframes pedal-a {
    0%, 100% { transform: rotate(-11deg); }
    50%      { transform: rotate(11deg); }
  }
  .leg-a { transform-box: view-box; transform-origin: 378px 300px; animation: pedal-a 1.56s ease-in-out infinite; }
  .leg-b { transform-box: view-box; transform-origin: 378px 300px; animation: pedal-a 1.56s ease-in-out infinite; animation-delay: -.78s; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3.5px); }
  }
  @keyframes headBob {
    0%, 100% { transform: rotate(-1.2deg) translateY(0); }
    50%      { transform: rotate(1.6deg) translateY(-2px); }
  }
  @keyframes flap {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(6deg); }
  }
  @keyframes pouchJiggle {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(1.6px) scaleY(1.05); }
  }
  @keyframes fishWig {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(8deg); }
  }
  .pelican-bob { transform-box: view-box; transform-origin: 368px 300px; animation: bob 1.56s ease-in-out infinite; }
  .head-grp    { transform-box: view-box; transform-origin: 432px 200px; animation: headBob 1.56s ease-in-out infinite; }
  .wing        { transform-box: view-box; transform-origin: 392px 236px; animation: flap .78s ease-in-out infinite; }
  .pouch       { transform-box: view-box; transform-origin: 520px 186px; animation: pouchJiggle .78s ease-in-out infinite; }
  .fish-tail   { transform-box: view-box; transform-origin: 600px 196px; animation: fishWig .6s ease-in-out infinite; }

  /* 狗：跑 + 尾巴 */
  @keyframes dogBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes dogLegs {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(14deg); }
  }
  @keyframes wag {
    0%, 100% { transform: rotate(-18deg); }
    50%      { transform: rotate(18deg); }
  }
  @keyframes earFlap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-14deg); }
  }
  .dog-grp  { transform-box: view-box; transform-origin: 150px 390px; animation: dogBob .39s ease-in-out infinite; }
  .dog-leg1 { transform-box: view-box; transform-origin: 128px 406px; animation: dogLegs .39s ease-in-out infinite; }
  .dog-leg2 { transform-box: view-box; transform-origin: 168px 406px; animation: dogLegs .39s ease-in-out infinite; animation-delay: -.195s; }
  .dog-tail  { transform-box: view-box; transform-origin: 118px 380px; animation: wag .39s ease-in-out infinite; }
  .dog-ear   { transform-box: view-box; transform-origin: 178px 352px; animation: earFlap .39s ease-in-out infinite; }

  @keyframes scroll-far  { from { transform: translateX(0); } to { transform: translateX(-400px); } }
  @keyframes scroll-near { from { transform: translateX(0); } to { transform: translateX(-800px); } }
  @keyframes drift       { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  @keyframes dash-move   { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -120; } }
  .hills-far  { transform-box: view-box; animation: scroll-far  22s linear infinite; }
  .hills-near { transform-box: view-box; animation: scroll-near 11s linear infinite; }
  .clouds     { transform-box: view-box; animation: drift       32s linear infinite; }
  .road-dash  { animation: dash-move .9s linear infinite; }

  @keyframes whoosh {
    0%   { opacity: 0; transform: translateX(30px); }
    30%  { opacity: .7; }
    100% { opacity: 0; transform: translateX(-90px); }
  }
  .whoosh { animation: whoosh .7s linear infinite; }
  .whoosh:nth-of-type(2) { animation-delay: .18s; }
  .whoosh:nth-of-type(3) { animation-delay: .36s; }
  .whoosh:nth-of-type(4) { animation-delay: .54s; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 500" role="img" aria-label="日落时分，一只鹈鹕骑着自行车，嘴里叼着鱼，身后追着一只狗">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3352"/>
      <stop offset="55%" stop-color="#6c4a6e"/>
      <stop offset="82%" stop-color="#c76b4f"/>
      <stop offset="100%" stop-color="#f2a65a"/>
    </linearGradient>
    <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="55%" stop-color="#ff9e5e"/>
      <stop offset="100%" stop-color="#ff9e5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c3d58"/>
      <stop offset="100%" stop-color="#342a40"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fff4ec"/>
      <stop offset="55%" stop-color="#f7ead7"/>
      <stop offset="100%" stop-color="#e0cba9"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd08a"/>
      <stop offset="100%" stop-color="#eda64f"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e88c4a"/>
      <stop offset="100%" stop-color="#d06a2f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <circle cx="620" cy="330" r="150" fill="url(#sunG)"/>
  <circle cx="620" cy="330" r="52" fill="#ffd27a"/>

  <g class="clouds" opacity=".5">
    <g fill="#4a3a5c">
      <ellipse cx="120" cy="110" rx="44" ry="14"/>
      <ellipse cx="158" cy="102" rx="30" ry="16"/>
      <ellipse cx="88"  cy="104" rx="24" ry="12"/>
    </g>
    <g fill="#5a4a6a">
      <ellipse cx="430" cy="80"  rx="38" ry="12"/>
      <ellipse cx="462" cy="74"  rx="24" ry="13"/>
      <ellipse cx="406" cy="76"  rx="20" ry="10"/>
    </g>
    <g fill="#4a3a5c">
      <ellipse cx="980" cy="120" rx="44" ry="14"/>
      <ellipse cx="1018" cy="112" rx="30" ry="16"/>
    </g>
  </g>

  <!-- 飞鸟剪影 -->
  <g stroke="#2b2338" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M300 150 q 8 -8 16 0 q 8 -8 16 0"/>
    <path d="M346 134 q 6 -6 12 0 q 6 -6 12 0"/>
    <path d="M266 170 q 6 -6 12 0 q 6 -6 12 0"/>
  </g>

  <g class="hills-far" opacity=".7">
    <path d="M0 400 Q 80 320 160 400 T 320 400 T 480 400 T 640 400 T 800 400 T 960 400 T 1120 400 L1120 420 L0 420 Z" fill="#4a3b58"/>
    <path d="M400 400 Q 470 340 540 400 T 680 400 T 820 400 T 960 400 T 1100 400 T 1240 400 L1240 420 L400 420 Z" fill="#5a4868"/>
  </g>

  <rect x="0" y="404" width="800" height="40" fill="url(#groundG)"/>

  <g class="hills-near">
    <g fill="#43344f">
      <circle cx="60" cy="404" r="18"/><circle cx="84" cy="404" r="13"/>
      <circle cx="260" cy="404" r="22"/><circle cx="288" cy="404" r="14"/>
      <circle cx="470" cy="404" r="16"/><circle cx="492" cy="404" r="11"/>
      <circle cx="660" cy="404" r="20"/><circle cx="686" cy="404" r="13"/>
    </g>
    <g fill="#43344f" transform="translate(800 0)">
      <circle cx="60" cy="404" r="18"/><circle cx="84" cy="404" r="13"/>
      <circle cx="260" cy="404" r="22"/><circle cx="288" cy="404" r="14"/>
      <circle cx="470" cy="404" r="16"/><circle cx="492" cy="404" r="11"/>
      <circle cx="660" cy="404" r="20"/><circle cx="686" cy="404" r="13"/>
    </g>
  </g>

  <rect x="0" y="440" width="800" height="60" fill="#3a314a"/>
  <rect x="0" y="440" width="800" height="4" fill="#554a63"/>
  <line class="road-dash" x1="-40" y1="472" x2="860" y2="472" stroke="#f0d9a8" stroke-width="5"
        stroke-dasharray="46 34" stroke-linecap="round" opacity=".8"/>

  <!-- 速度线 -->
  <g stroke="#ffe6c4" stroke-width="3" stroke-linecap="round" opacity=".6">
    <line class="whoosh" x1="226" y1="250" x2="286" y2="250"/>
    <line class="whoosh" x1="210" y1="288" x2="282" y2="288"/>
    <line class="whoosh" x1="232" y1="326" x2="292" y2="326"/>
    <line class="whoosh" x1="218" y1="364" x2="276" y2="364"/>
  </g>

  <!-- ============ 追车的狗 ============ -->
  <g class="dog-grp">
    <g class="dog-tail">
      <path d="M120 382 q -14 -6 -20 2 q 8 8 20 4 z" fill="#8a6138"/>
    </g>
    <g class="dog-leg1" stroke="#8a6138" stroke-width="6" stroke-linecap="round">
      <line x1="130" y1="404" x2="126" y2="420"/>
      <line x1="130" y1="404" x2="138" y2="420"/>
    </g>
    <g class="dog-leg2" stroke="#8a6138" stroke-width="6" stroke-linecap="round">
      <line x1="168" y1="404" x2="164" y2="420"/>
      <line x1="168" y1="404" x2="176" y2="420"/>
    </g>
    <ellipse cx="150" cy="386" rx="34" ry="22" fill="#a9763f"/>
    <g class="dog-ear">
      <path d="M178 352 q 10 6 6 20 q -8 -6 -8 -16 z" fill="#8a6138"/>
    </g>
    <circle cx="186" cy="366" r="15" fill="#b9834a"/>
    <ellipse cx="200" cy="370" rx="7" ry="4.5" fill="#8a6138"/>
    <circle cx="190" cy="362" r="2.5" fill="#241c10"/>
    <path d="M204 362 q 4 -2 7 0" stroke="#241c10" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ============ 自行车 ============ -->
  <g id="bike">
    <g>
      <circle cx="288" cy="362" r="58" fill="none" stroke="#241f30" stroke-width="8"/>
      <g class="wheel-back">
        <circle cx="288" cy="362" r="48" fill="none" stroke="#8d8395" stroke-width="2.5"/>
        <g stroke="#6f657a" stroke-width="2.5" stroke-linecap="round">
          <line x1="288" y1="316" x2="288" y2="408"/><line x1="242" y1="362" x2="334" y2="362"/>
          <line x1="255" y1="329" x2="321" y2="395"/><line x1="321" y1="329" x2="255" y2="395"/>
          <line x1="266" y1="320" x2="310" y2="404"/><line x1="310" y1="320" x2="266" y2="404"/>
          <line x1="246" y1="344" x2="330" y2="380"/><line x1="246" y1="380" x2="330" y2="344"/>
        </g>
        <circle cx="288" cy="362" r="6" fill="#554a63"/>
      </g>
    </g>

    <g>
      <circle cx="556" cy="362" r="58" fill="none" stroke="#241f30" stroke-width="8"/>
      <g class="wheel-front">
        <circle cx="556" cy="362" r="48" fill="none" stroke="#8d8395" stroke-width="2.5"/>
        <g stroke="#6f657a" stroke-width="2.5" stroke-linecap="round">
          <line x1="556" y1="316" x2="556" y2="408"/><line x1="510" y1="362" x2="602" y2="362"/>
          <line x1="523" y1="329" x2="589" y2="395"/><line x1="589" y1="329" x2="523" y2="395"/>
          <line x1="534" y1="320" x2="578" y2="404"/><line x1="578" y1="320" x2="534" y2="404"/>
          <line x1="514" y1="344" x2="598" y2="380"/><line x1="514" y1="380" x2="598" y2="344"/>
        </g>
        <circle cx="556" cy="362" r="6" fill="#554a63"/>
      </g>
    </g>

    <g stroke="#2fa8a0" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="288" y1="362" x2="410" y2="388"/>
      <line x1="288" y1="362" x2="352" y2="284"/>
      <line x1="410" y1="388" x2="352" y2="284"/>
      <line x1="352" y1="284" x2="536" y2="278"/>
      <line x1="410" y1="388" x2="546" y2="312"/>
      <line x1="536" y1="278" x2="546" y2="312"/>
      <line x1="546" y1="312" x2="556" y2="362"/>
    </g>
    <g stroke="#63d6cb" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".7">
      <line x1="356" y1="280" x2="532" y2="274"/>
      <line x1="414" y1="384" x2="542" y2="309"/>
    </g>

    <path d="M536 278 L544 254 Q548 244 560 244 L586 244" fill="none" stroke="#1f7a74" stroke-width="8" stroke-linecap="round"/>
    <circle cx="586" cy="244" r="6" fill="#ffb36b"/>

    <path d="M330 276 q 22 -10 46 0 q -22 12 -46 0 z" fill="#2e2840"/>
    <line x1="352" y1="284" x2="352" y2="292" stroke="#2e2840" stroke-width="5"/>

    <g class="crank">
      <circle cx="410" cy="388" r="26" fill="none" stroke="#6b6178" stroke-width="4"/>
      <circle cx="410" cy="388" r="20" fill="none" stroke="#7e7489" stroke-width="3"/>
      <g stroke="#554a63" stroke-width="5" stroke-linecap="round">
        <line x1="410" y1="388" x2="410" y2="356"/><line x1="410" y1="388" x2="410" y2="420"/>
      </g>
      <rect x="396" y="348" width="28" height="9" rx="4" fill="#2e2840"/>
      <rect x="396" y="416" width="28" height="9" rx="4" fill="#2e2840"/>
      <circle cx="410" cy="388" r="5" fill="#3a314a"/>
    </g>
  </g>

  <!-- ============ 鹈鹕 ============ -->
  <g class="pelican-bob">
    <g class="leg-b" stroke="#e88c4a" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="378" y1="300" x2="394" y2="340"/>
      <line x1="394" y1="340" x2="404" y2="372"/>
      <path d="M404 372 l 16 5 l -4 8 l -14 -3 z" fill="#e88c4a" stroke="none"/>
    </g>

    <path d="M312 236 q -34 -6 -46 12 q 22 8 44 2 z" fill="#cfbfa0"/>

    <ellipse cx="368" cy="250" rx="64" ry="50" fill="url(#bodyG)"/>
    <path d="M312 268 q 56 40 118 4 q -8 34 -58 34 q -48 0 -60 -38 z" fill="#d9c7a4" opacity=".8"/>

    <path d="M404 222 C 418 186, 424 170, 438 162 L 462 178 C 448 192, 442 208, 432 232 Z" fill="url(#bodyG)"/>

    <g class="head-grp">
      <path d="M436 146 q -14 -12 -20 2 q 8 2 12 8 z" fill="#e0d4bd"/>
      <circle cx="456" cy="166" r="26" fill="url(#bodyG)"/>

      <path d="M476 158 Q 556 158 622 176 Q 560 186 478 180 Z" fill="url(#beakG)" stroke="#b85a24" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="484" y1="166" x2="608" y2="176" stroke="#d06a2f" stroke-width="1.6" opacity=".6"/>

      <path class="pouch" d="M482 178 Q 500 232 566 208 Q 606 194 618 178 Q 552 196 482 178 Z"
            fill="url(#pouchG)" stroke="#d6913f" stroke-width="1.4" stroke-linejoin="round"/>

      <!-- 嘴里叼的鱼尾巴 -->
      <g class="fish-tail">
        <path d="M612 184 q 16 2 26 -8 q -4 14 -22 16 z" fill="#5d88b8"/>
      </g>

      <circle cx="462" cy="158" r="6.5" fill="#241c10"/>
      <circle cx="464" cy="156" r="2.2" fill="#ffffff"/>
      <path d="M452 148 q 10 -5 19 -1" stroke="#b9ab8c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>

    <g class="wing">
      <path d="M386 232 q 44 -14 62 12 q -20 26 -52 22 q -18 -2 -10 -34 z" fill="#efe3cb" stroke="#cfbfa0" stroke-width="2"/>
      <path d="M420 236 q 22 4 26 16" stroke="#cfbfa0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M406 250 q 22 6 24 16" stroke="#cfbfa0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>

    <g class="leg-a" stroke="#e88c4a" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="378" y1="300" x2="396" y2="338"/>
      <line x1="396" y1="338" x2="412" y2="370"/>
      <path d="M412 370 l 16 6 l -5 8 l -14 -4 z" fill="#e88c4a" stroke="none"/>
    </g>
  </g>

  <!-- 前景草丛 -->
  <g class="hills-near" opacity=".9">
    <g fill="#3a2f4a" transform="translate(0 6)">
      <path d="M120 470 q 8 -26 16 0 q 8 -30 16 0 z"/>
      <path d="M400 470 q 8 -22 16 0 q 8 -28 16 0 z"/>
      <path d="M700 470 q 8 -24 16 0 q 8 -30 16 0 z"/>
    </g>
    <g fill="#3a2f4a" opacity=".9" transform="translate(800 6)">
      <path d="M120 470 q 8 -26 16 0 q 8 -30 16 0 z"/>
      <path d="M400 470 q 8 -22 16 0 q 8 -28 16 0 z"/>
      <path d="M700 470 q 8 -24 16 0 q 8 -30 16 0 z"/>
    </g>
  </g>
</svg>
</div>
</body>
</html>
